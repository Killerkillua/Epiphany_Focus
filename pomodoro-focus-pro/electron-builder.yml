appId: com.pomodoro.focuspro
productName: 静界专注
publish:
  provider: github
  owner: Killerkillua
  repo: Epiphany_Focus
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - resources/**
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
# 本机非管理员无法解压 winCodeSign（darwin 符号链接），故关闭内置资源编辑；
# Windows 图标由 afterPack（resedit）写入 exe；NSIS include 再固定快捷方式 Icon。
# 正式签名仍走 CI SignPath（release.yml + SIGNPATH_ENABLED）。
afterPack: scripts/after-pack-win-icon.mjs
extraResources:
  - from: resources/icon.ico
    to: icon.ico
win:
  executableName: pomodoro-focus-pro
  icon: build/icon.ico
  signAndEditExecutable: false
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  include: build/installer.nsh
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
  icon: build/icon.png
  maintainer: pomodoro-focus-pro
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
