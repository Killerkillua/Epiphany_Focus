appId: com.pomodoro.focuspro
productName: 静界专注
publish:
  provider: github
  owner: Killerkillua
  repo: Epiphany_Focus
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - resources/**
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: pomodoro-focus-pro
  icon: build/icon.ico
  # 跳过 exe 签名与版本资源编辑：本机非管理员无法解压 winCodeSign 中的 darwin 符号链接，
  # 且本项目未配置代码签名证书；设置 false 后 electron-builder 不再下载 winCodeSign 工具。
  signAndEditExecutable: false
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
  icon: build/icon.png
  maintainer: pomodoro-focus-pro
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
