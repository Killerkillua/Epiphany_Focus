# 公开前勿打 tag 发版：仓库转公开与历史泄密处置（P0-2 第 0 步）完成前，push v* 会触发本流水线并尝试 publish。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder-args: '--win'
          - os: macos-latest
            builder-args: '--mac'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: pomodoro-focus-pro
    steps:
      - uses: actions/checkout@v4

      - name: 版本一致性守卫
        shell: bash
        run: |
          TAG=${GITHUB_REF_NAME#v}
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "::error::Git tag v${TAG} 与 package.json version (${PKG_VERSION}) 不一致"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pomodoro-focus-pro/package-lock.json

      - run: npm ci
      - run: npm run build

      - name: 打包发布
        run: npx electron-builder ${{ matrix.builder-args }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
